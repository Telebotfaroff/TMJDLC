name: Capture Page HTML

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Exact studio, listing or post URL to inspect
        required: true
        type: string
      timeout:
        description: HTTP and browser navigation timeout in seconds
        required: false
        default: "30"
        type: string

permissions:
  contents: read

concurrency:
  group: page-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml playwright
          playwright install --with-deps chromium

      - name: Capture page (HTTP first, Playwright fallback)
        env:
          TARGET_URL: ${{ inputs.target_url }}
          CAPTURE_TIMEOUT: ${{ inputs.timeout }}
        run: |
          python scripts/capture_page.py \
            --url "$TARGET_URL" \
            --timeout "$CAPTURE_TIMEOUT" \
            --output artifacts/page-capture

      - name: Upload HTML and network report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-capture
          path: artifacts/page-capture/
          if-no-files-found: warn
          retention-days: 7
