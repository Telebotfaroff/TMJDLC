name: Resolve Javtiful Stream

on:
  workflow_dispatch:
    inputs:
      post_url:
        description: Javtiful post URL
        required: true
        default: "https://javtiful.com/video/113371/dvmm-444"
        type: string
      quality:
        description: Preferred quality (leave blank for highest available)
        required: false
        default: "720"
        type: string
      timeout:
        description: Browser timeout in seconds
        required: false
        default: "45"
        type: string
      capture_seconds:
        description: Seconds to wait after starting playback
        required: false
        default: "20"
        type: string

permissions:
  contents: read

concurrency:
  group: javtiful-stream-resolver
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install TMJDLC and browser
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m playwright install --with-deps chromium

      - name: Resolve stream using provider module
        env:
          POST_URL: ${{ inputs.post_url }}
          QUALITY: ${{ inputs.quality }}
          TIMEOUT: ${{ inputs.timeout }}
          CAPTURE_SECONDS: ${{ inputs.capture_seconds }}
        run: |
          ARGS=(--url "$POST_URL" --timeout "$TIMEOUT" --capture-seconds "$CAPTURE_SECONDS")
          if [ -n "$QUALITY" ]; then
            ARGS+=(--quality "$QUALITY")
          fi
          python scripts/resolve_javtiful_stream.py "${ARGS[@]}" --output artifacts/javtiful-resolution

      - name: Upload safe stream metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javtiful-stream-resolution
          path: artifacts/javtiful-resolution/
          if-no-files-found: warn
          retention-days: 2
