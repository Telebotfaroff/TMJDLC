name: MissAV Functional Smoke Test

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "MissAV video page to test"
        required: true
        type: string
        default: "https://missav.ws/en/rlmp-013-uncensored-leak"
      search_query:
        description: "Search phrase"
        required: true
        type: string
        default: "uncensored"

permissions:
  contents: read

concurrency:
  group: missav-functional-smoke-test
  cancel-in-progress: false

jobs:
  functional-test:
    name: Search, metadata, and short HLS sample
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install TMJDLC and MissAV API
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run functional smoke test
        env:
          MISSAV_TEST_URL: ${{ inputs.video_url }}
          MISSAV_SEARCH_QUERY: ${{ inputs.search_query }}
          MISSAV_REPORT_PATH: artifacts/missav_functional_probe.json
        run: python .github/scripts/missav_functional_probe.py

      - name: Upload functional test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: missav-functional-test-${{ github.run_id }}
          path: artifacts/missav_functional_probe.json
          if-no-files-found: warn
          retention-days: 14
