name: MissAV Access Probe

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "MissAV video page to test"
        required: true
        type: string
        default: "https://missav.ws/en/rlmp-013-uncensored-leak"
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: missav-access-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Test MissAV API access
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install TMJDLC and MissAV API
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Probe MissAV metadata endpoint
        env:
          MISSAV_TEST_URL: ${{ inputs.video_url || 'https://missav.ws/en/rlmp-013-uncensored-leak' }}
          MISSAV_REPORT_PATH: artifacts/missav_probe.json
        run: python .github/scripts/missav_access_probe.py

      - name: Upload probe report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: missav-access-probe-${{ github.run_id }}
          path: artifacts/missav_probe.json
          if-no-files-found: warn
          retention-days: 14
