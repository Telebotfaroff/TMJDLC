name: Inspect Player

on:
  workflow_dispatch:
    inputs:
      post_url:
        description: Exact video post URL to inspect
        required: true
        default: "https://javtiful.com/video/115253/cawb-062-reducing-mosaic"
        type: string
      timeout:
        description: Request timeout in seconds
        required: false
        default: "30"
        type: string

permissions:
  contents: read

concurrency:
  group: player-inspection
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HTTP parsing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Inspect post and player assets using HTTP
        env:
          POST_URL: ${{ inputs.post_url }}
          REQUEST_TIMEOUT: ${{ inputs.timeout }}
        run: |
          python scripts/inspect_player.py \
            --url "$POST_URL" \
            --timeout "$REQUEST_TIMEOUT" \
            --output artifacts/player-inspection

      - name: Upload sanitized HTML, scripts and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-inspection
          path: artifacts/player-inspection/
          if-no-files-found: warn
          retention-days: 7
